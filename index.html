<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grupo Asset — Resultados 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{--azul:#1F4E78;--azul-cl:#E6F0FA;--verde:#1baf7a;--verde-cl:#C6E0B4;--rojo:#e34948;--gris-bg:#F5F6F8;--gris-br:#E2E4E9;--gris-tx:#6B7280;--negro:#111827;--blanco:#ffffff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--gris-bg);color:var(--negro);font-size:14px;line-height:1.6}
.page-header{background:var(--azul);padding:1.75rem 2.5rem;display:flex;align-items:center;justify-content:space-between}
.page-header h1{font-family:'DM Serif Display',serif;font-size:26px;font-weight:400;color:#fff;letter-spacing:-.3px}
.page-header p{font-size:12px;color:rgba(255,255,255,.6);margin-top:4px}
.badge{background:rgba(255,255,255,.12);color:rgba(255,255,255,.85);font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.2)}
.container{max-width:1140px;margin:0 auto;padding:2rem 1.5rem}
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:2rem}
.kpi{background:var(--blanco);border-radius:12px;padding:1.25rem 1.5rem;border:1px solid var(--gris-br)}
.kpi-label{font-size:11px;color:var(--gris-tx);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem}
.kpi-value{font-family:'DM Serif Display',serif;font-size:28px;font-weight:400;letter-spacing:-.5px}
.kpi-value.pos{color:var(--verde)}.kpi-value.neg{color:var(--rojo)}
.kpi-delta{font-size:11px;color:var(--gris-tx);margin-top:.35rem}
.kpi-delta .pos{color:var(--verde)}.kpi-delta .neg{color:var(--rojo)}
.card{background:var(--blanco);border-radius:12px;border:1px solid var(--gris-br);padding:1.5rem;margin-bottom:1.5rem}
.card-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--gris-tx);margin-bottom:1.25rem}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:1rem}
.leg-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--gris-tx)}
.leg-sq{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem}
.tab{padding:5px 14px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid var(--gris-br);background:transparent;color:var(--gris-tx);font-family:'Inter',sans-serif;transition:all .15s}
.tab:hover{border-color:#b0b8c9}
.tab.active{background:var(--azul);color:#fff;border-color:var(--azul)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
table th{padding:8px 10px;text-align:right;color:var(--gris-tx);font-weight:500;border-bottom:1px solid var(--gris-br);white-space:nowrap;font-size:11px}
table th:first-child{text-align:left;min-width:200px}
table td{padding:6px 10px;text-align:right;border-bottom:1px solid #f0f1f4;white-space:nowrap;color:var(--negro)}
table td:first-child{text-align:left;color:var(--gris-tx)}
tr.sec-hdr td{background:var(--azul-cl);color:var(--azul)!important;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;user-select:none}
tr.sec-hdr .arrow{display:inline-block;width:14px;transition:transform .15s;color:var(--azul)}
tr.sec-hdr.open .arrow{transform:rotate(90deg)}
tr.sub td:first-child{padding-left:20px}
tr.sec-total td{background:#f8f9fb;font-weight:700;color:var(--negro)!important;border-top:1px solid var(--gris-br)}
tr.sec-total td.pos-val{color:var(--verde)!important}
tr.sec-total td.neg-val{color:var(--rojo)!important}
tr.grand td{background:var(--azul);color:#fff!important;font-weight:700}
tr.ganancia td{background:var(--verde-cl);color:#174c0a!important;font-weight:700;font-size:13px}
tr.ganancia{border-top:2px solid #8db87a}
.pos-val{color:var(--verde)!important}.neg-val{color:var(--rojo)!important}
tr.ganancia td.pos-val{color:#0a6629!important}
tr.ganancia td.neg-val{color:#9b1c1c!important}
.chart-wrap{position:relative;height:260px;width:100%}
.page-footer{text-align:center;padding:2rem;font-size:11px;color:var(--gris-tx)}
@media(max-width:700px){.kpi-row{grid-template-columns:1fr}.page-header{flex-direction:column;align-items:flex-start;gap:.5rem}}
</style>
</head>
<body>

<header class="page-header">
  <div>
    <h1>Grupo Asset</h1>
    <p>Estado de resultados mensual · Enero – Octubre 2026</p>
  </div>
  <span class="badge">Uso interno · Socios</span>
</header>

<main class="container">
  <div class="kpi-row" id="kpis"></div>

  <div class="card">
    <div class="card-title">Evolución mensual consolidada</div>
    <div class="legend">
      <span class="leg-item"><span class="leg-sq" style="background:#2a78d6"></span>Ingresos</span>
      <span class="leg-item"><span class="leg-sq" style="background:#e34948"></span>Egresos</span>
      <span class="leg-item"><span class="leg-sq" style="background:#1baf7a"></span>Ganancia / (Pérdida)</span>
    </div>
    <div class="chart-wrap"><canvas id="chartEvol" role="img" aria-label="Evolución mensual consolidada Enero a Octubre 2026"></canvas></div>
  </div>

  <div class="card">
    <div class="card-title">Comparativo mensual consolidado — todos los rubros</div>
    <div class="table-wrap"><table id="tblComp"></table></div>
  </div>

  <div class="card">
    <div class="card-title">Detalle por empresa</div>
    <div class="tabs" id="tabsMes"></div>
    <div class="table-wrap"><table id="tblDet"></table></div>
  </div>
</main>

<footer class="page-footer" id="footer"></footer>

const fmtN = v => {
  if(v===0||v===-0) return '-';
  const s = v<0 ? '-' : '';
  return s + '$' + Math.abs(Math.round(v)).toLocaleString('es-AR');
};
const fmtK = v => {
  const abs=Math.abs(v), s=v<0?'-':'';
  if(abs>=1e9) return s+'$'+(abs/1e9).toFixed(1)+'B';
  if(abs>=1e6) return s+'$'+Math.round(abs/1e6).toLocaleString('es-AR')+'M';
  return s+'$'+Math.round(abs/1e3).toLocaleString('es-AR')+'K';
};
const cls = v => v>0?'pos-val':v<0?'neg-val':'';
const sum5 = a => a.reduce((x,y)=>x+y,0);

function toggleSection(id){
  const header = document.getElementById(id);
  const opening = header.classList.toggle('open');
  document.querySelectorAll(`tr[data-group="${id}"]`).forEach(r => r.style.display = opening ? '' : 'none');
}

// Tabla detalle por empresa — datos reales
const INGR_SEC = ['Ingresos Financieros','Ingresos Operativos'];
const SEC_ORDER = ['Ingresos Financieros','Ingresos Operativos','Gs Administración','Gs Operativos','Impuestos','Rdos Extraordinarios'];

function renderDet(mes) {
  const flat = DET_REAL[mes];
  // Group by rubro
  const grouped = {};
  SEC_ORDER.forEach(s => grouped[s] = []);
  flat.forEach(r => { if(grouped[r.rubro]!==undefined) grouped[r.rubro].push(r); });

  let html = `<thead><tr><th>Concepto</th>${ENTS.map(e=>`<th>${e}</th>`).join('')}<th>Consolidado</th></tr></thead><tbody>`;
  let tI=[0,0,0,0,0], tE=[0,0,0,0,0];

  SEC_ORDER.forEach((sn, si) => {
    const lines = grouped[sn];
    const isI = INGR_SEC.includes(sn);
    const secId = `det-sec-${si}`;
    html += `<tr class="sec-hdr" id="${secId}" onclick="toggleSection('${secId}')"><td colspan="7"><span class="arrow">▸</span>${sn}</td></tr>`;
    let st=[0,0,0,0,0];
    lines.forEach(r => {
      const allZero = r.vals.every(v=>v===0||v===-0);
      if(allZero) return;
      st = st.map((v,i)=>v+r.vals[i]);
      if(isI) tI=tI.map((v,i)=>v+r.vals[i]); else tE=tE.map((v,i)=>v+r.vals[i]);
      const c = sum5(r.vals);
      html += `<tr data-group="${secId}" style="display:none"><td style="padding-left:20px">${r.sub}</td>${r.vals.map(v=>`<td class="${cls(v)}">${(v===0||v===-0)?'-':fmtN(v)}</td>`).join('')}<td class="${cls(c)}">${c===0?'-':fmtN(c)}</td></tr>`;
    });
    const s=sum5(st);
    html += `<tr class="sec-total"><td>Total ${sn}</td>${st.map(v=>`<td class="${cls(v)}">${fmtN(v)}</td>`).join('')}<td class="${cls(s)}">${fmtN(s)}</td></tr>`;
  });

  const ti=sum5(tI), te=sum5(tE), gc=ti+te;
  html += `<tr class="grand"><td>TOTAL INGRESOS</td>${tI.map(v=>`<td>${fmtN(v)}</td>`).join('')}<td>${fmtN(ti)}</td></tr>`;
  html += `<tr class="grand"><td>TOTAL EGRESOS</td>${tE.map(v=>`<td>${fmtN(v)}</td>`).join('')}<td>${fmtN(te)}</td></tr>`;
  const gan=tI.map((v,i)=>v+tE[i]);
  html += `<tr class="ganancia"><td>Ganancia / (Pérdida) del mes</td>${gan.map(v=>`<td class="${cls(v)}">${fmtN(v)}</td>`).join('')}<td class="${cls(gc)}">${fmtN(gc)}</td></tr>`;
  html += '</tbody>';
  document.getElementById('tblDet').innerHTML = html;
}

});
